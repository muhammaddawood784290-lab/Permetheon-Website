name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # NOTE: no Python/Pillow setup — deliberately. The point of this job is
      # to prove the build works the way production deploys it: committed
      # variants + lock must be fresh WITHOUT any image tooling, and a stale
      # repo fails HERE with the real reason instead of at deploy time.
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check committed image variants are fresh (Python-free)
        working-directory: frontend
        run: npm run check:image-variants

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Production build (no Python on this runner)
        working-directory: frontend
        run: npm run build
